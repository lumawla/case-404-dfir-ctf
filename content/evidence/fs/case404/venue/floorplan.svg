<text x="20" y="770" font-family="Arial, sans-serif" font-size="13" fill="#a79fb3">Fictional venue for CASE 404.</text><text x="20" y="790" font-family="Arial, sans-serif" font-size="13" fill="#a79fb3">Walking times are minimums at a fast pace using normal routes.</text><text x="20" y="810" font-family="Arial, sans-serif" font-size="13" fill="#a79fb3">The west stairs and the balcony were closed for the event; the north gate was the only public exterior exit (other exits alarmed).</text>
