<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 850" width="1040" height="850" role="img" aria-labelledby="t d">
<title id="t">Blackthorn Hall - event floor plan (schematic, not to scale)</title>
<desc id="d">Fictional venue for CASE 404. Walking times are minimums at a fast pace using normal routes. The west stairs and the balcony were closed for the event; the north gate was the only public exterior exit (other exits alarmed). Photo booth, main floor, backstage corridor, east stairs, second-floor corridor, projection room: at least 4 minutes. DJ/AV station, main floor, backstage corridor, east stairs, second-floor corridor, projection room: at least 4 minutes. Stage, main floor, backstage corridor, east stairs, second-floor corridor, projection room: at least 3 minutes. North gate, main floor, backstage corridor, east stairs, second-floor corridor, projection room: at least 3 minutes. Photo booth, main floor, stage: at least 1 minutes. North gate, Cedar Street, Moonrise 24/7 Kiosk (off campus): at least 8 minutes.</desc>
